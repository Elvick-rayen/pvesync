[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-pve-sync"
dynamic = ["version"]
description = "Event-driven one-way synchronization of Proxmox VE virtual machines into NetBox"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["requests>=2.25", "PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5", "ruff>=0.4", "types-requests", "types-PyYAML"]

[project.scripts]
netbox-pve-sync = "netbox_pve_sync.cli:entrypoint"

[tool.setuptools.dynamic]
version = { attr = "netbox_pve_sync.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a real NetBox (set NETBOX_IT_URL and NETBOX_IT_TOKEN)"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003", "SIM105", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "SIM102"]
